<!DOCTYPE html>
<html>
<head>
    <title>My AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sidebar">
        <h2>✦ My AI</h2>
        <button onclick="newChat()">New Chat</button>
        <h3>History</h3>
        <div id="history"></div>
    </div>

    <div class="main">

        <h3>My AI</h3>

        <div id="chat">
            <h2>How can I help you?</h2>
            <p>Ask me anything!</p>
        </div>

        <div class="input-box">
            <input type="text" id="message" placeholder="Message My AI...">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
